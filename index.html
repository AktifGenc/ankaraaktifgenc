<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ankara Aktif Genç Spor Kulübü - Doğa Etkinlikleri & Gençlik Kampları</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brandBlue: '#0A72BA',
            brandDarkBlue: '#074F83',
            brandNavy: '#1D3557',
            brandRed: '#E30613',
            brandDarkRed: '#B8050F'
          }
        }
      }
    }
  </script>

  <style>
    /* Custom scrollbar & visual glassmorphism */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col relative">

  <!-- BİLDİRİM TOAST MESAJI -->
  <div id="toastNotification" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-slate-700 pointer-events-none">
    <div id="toastIcon" class="text-emerald-400 text-lg"><i class="fa-solid fa-circle-check"></i></div>
    <span id="toastMessage" class="text-sm font-semibold">İşlem başarıyla gerçekleşti.</span>
  </div>

  <!-- BİLGİ İLETİ / ONAY MODALI -->
  <div id="customDialogModal" class="hidden fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
      <div id="dialogIcon" class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-2xl mx-auto">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h3 id="dialogTitle" class="font-bold text-lg text-brandNavy">Emin misiniz?</h3>
      <p id="dialogDesc" class="text-xs text-slate-500">Bu işlem geri alınamaz.</p>
      <div class="flex items-center justify-center space-x-3 pt-2">
        <button id="dialogCancelBtn" onclick="closeCustomDialog()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition">İptal</button>
        <button id="dialogConfirmBtn" class="px-4 py-2 bg-brandRed hover:bg-brandDarkRed text-white text-xs font-bold rounded-xl transition">Evet, Devam Et</button>
      </div>
    </div>
  </div>

  <!-- LİDER YÖNETİM ÇUBUĞU (Sadece Giriş Yapıldığında Görünür) -->
  <div id="adminHeaderBar" class="hidden bg-slate-900 text-white text-xs py-2 px-4 sticky top-0 z-50 shadow-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center space-x-2">
        <span class="inline-block w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
        <span class="font-bold tracking-wide">YÖNETİCİ PANELİ AKTİF</span>
        <span class="text-slate-400">| Kullanıcı: <strong id="currentAdminUser" class="text-amber-400">Lider</strong></span>
      </div>
      <div class="flex items-center space-x-2 flex-wrap gap-1">
        <button onclick="openCmsModal('texts')" class="px-3 py-1 bg-brandBlue hover:bg-brandDarkBlue text-white font-semibold rounded-md transition flex items-center gap-1">
          <i class="fa-solid fa-pen-to-square text-xs"></i> Metinleri Düzenle
        </button>
        <button onclick="openWeeklyTrackingModal()" class="px-3 py-1 bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-md transition flex items-center gap-1 shadow-sm">
          <i class="fa-solid fa-calendar-check text-xs"></i> Haftalık Takip
        </button>
        <button onclick="openAddAthleteModal()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-md transition flex items-center gap-1">
          <i class="fa-solid fa-user-plus text-xs"></i> Sporcu
        </button>
        <button onclick="openAddAnnouncementModal()" class="px-3 py-1 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-md transition flex items-center gap-1">
          <i class="fa-solid fa-bullhorn text-xs"></i> Duyuru
        </button>
        <button onclick="openAddLeaderModal()" class="px-3 py-1 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-md transition flex items-center gap-1">
          <i class="fa-solid fa-user-tie text-xs"></i> Lider
        </button>
        <button onclick="openAddGalleryModal()" class="px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-md transition flex items-center gap-1">
          <i class="fa-solid fa-image text-xs"></i> Galeri
        </button>
        <button onclick="openApplicationsModal()" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-md transition flex items-center gap-1">
          <i class="fa-solid fa-inbox text-xs"></i> Başvurular (<span id="appCountBadge">0</span>)
        </button>
        <button onclick="logoutAdmin()" class="px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-md transition ml-2">
          <i class="fa-solid fa-right-from-bracket"></i> Çıkış
        </button>
      </div>
    </div>
  </div>

  <!-- ÜST NAVİGASYON (Navbar) -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md shadow-sm border-b border-slate-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-20 items-center">
        
        <!-- LOGO & MARKA -->
        <a href="#" class="flex items-center space-x-3 group">
          <div class="w-12 h-12 flex items-center justify-center shrink-0">
            <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow">
              <path d="M 50 10 L 90 55 L 75 55 L 50 28 L 25 55 L 10 55 Z" fill="#0A72BA"/>
              <path d="M 10 55 L 50 10 L 20 70 Z" fill="#074F83" opacity="0.3"/>
              <circle cx="50" cy="50" r="16" fill="#E30613"/>
            </svg>
          </div>
          <div class="flex flex-col">
            <span class="text-xl font-black tracking-tight text-brandDarkBlue leading-tight group-hover:text-brandBlue transition">
              ANKARA AKTİF GENÇ
            </span>
            <span class="text-xs font-bold text-brandRed tracking-widest uppercase">
              Spor Kulübü
            </span>
          </div>
        </a>
        
        <!-- MASAÜSTÜ MENÜ -->
        <nav class="hidden lg:flex items-center space-x-6 font-semibold text-sm text-slate-700">
          <a href="#hakkimizda" class="hover:text-brandBlue transition">Hakkımızda</a>
          <a href="#branslar" class="hover:text-brandBlue transition">Branşlar</a>
          <a href="#puanlama" class="hover:text-brandBlue transition">Puan Durumu</a>
          <a href="#etkinlikler" class="hover:text-brandBlue transition">Etkinlikler</a>
          <a href="#liderler" class="hover:text-brandBlue transition">Liderler</a>
          <a href="#galeri" class="hover:text-brandBlue transition">Galeri</a>
          <a href="#sss" class="hover:text-brandBlue transition">S.S.S.</a>
        </nav>

        <div class="hidden lg:flex items-center space-x-3">
          <button id="loginBtnNav" onclick="openLoginModal()" class="px-4 py-2 rounded-xl text-slate-600 hover:text-brandBlue hover:bg-slate-100 text-sm font-bold transition flex items-center gap-1.5">
            <i class="fa-solid fa-lock text-xs"></i> Lider Girişi
          </button>
          <a href="#iletisim" class="px-5 py-2.5 rounded-xl bg-brandRed hover:bg-brandDarkRed text-white text-sm font-bold shadow-md shadow-brandRed/20 transition">
            Bize Katıl
          </a>
        </div>

        <!-- MOBİL MENÜ BUTONU -->
        <button id="menuBtn" onclick="toggleMobileMenu()" class="lg:hidden text-2xl text-slate-800 p-2 focus:outline-none">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>

    <!-- MOBİL MENÜ ÇEKMECESİ -->
    <div id="mobileMenu" class="hidden lg:hidden bg-white border-t border-slate-100 px-6 py-4 space-y-3 shadow-xl">
      <a href="#hakkimizda" onclick="toggleMobileMenu()" class="block font
